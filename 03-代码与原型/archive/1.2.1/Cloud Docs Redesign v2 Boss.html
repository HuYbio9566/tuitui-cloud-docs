<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>360 云文档 · AI 知识工作流方案 v2</title>
  <style>
    :root {
      --fs-primary: #3873FA;
      --fs-primary-hover: #5588FB;
      --fs-primary-active: #2A5FDB;
      --fs-primary-light: #CCE0FE;
      --fs-text-title: #333333;
      --fs-text-body: #333333;
      --fs-text-secondary: #666666;
      --fs-text-tertiary: #999999;
      --fs-text-placeholder: #999999;
      --fs-text-disabled: #CCCCCC;
      --fs-bg-body: #FFFFFF;
      --fs-bg-sidebar: #F6F6F6;
      --fs-bg-fill: #F2F2F2;
      --fs-bg-hover: #F7F9FA;
      --fs-bg-selected: #EDF1F5;
      --fs-border: #DDDDDD;
      --fs-divider: #EEEEEE;
      --fs-success: #12CD7A;
      --fs-warning: #FFAB2E;
      --fs-error: #FF4D48;
      --fs-radius-sm: 4px;
      --fs-radius-md: 6px;
      --fs-radius-lg: 8px;
      --fs-radius-xl: 12px;
      --fs-radius-full: 999px;
      --fs-shadow-sm: 0 1px 4px rgba(51,51,51,0.06);
      --fs-shadow-md: 0 4px 12px rgba(51,51,51,0.10);
      --fs-shadow-fab: 0 4px 12px rgba(56,115,250,0.30);
      --fs-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --fs-ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --fs-font: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--fs-text-title);
      background: #DDEBFF;
      font-family: var(--fs-font);
      text-rendering: geometricPrecision;
    }

    button, input, textarea { font-family: inherit; }
    button { cursor: pointer; }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 2px solid rgba(56, 115, 250, 0.35);
      outline-offset: 2px;
    }

    .shell {
      width: 100vw;
      height: 100vh;
      padding: 8px;
      background: linear-gradient(180deg, #E9F3FF 0%, #DCEBFF 100%);
    }

    .desktop {
      width: 100%;
      height: 100%;
      min-width: 0;
      display: flex;
      overflow: hidden;
      border-radius: 12px;
      background: #FFFFFF;
      box-shadow: 0 10px 24px rgba(40, 76, 142, 0.16);
    }

    .left-rail {
      width: 68px;
      flex: 0 0 68px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 12px 6px;
      background: #EAF4FF;
      border-right: 1px solid rgba(188, 212, 240, 0.72);
    }

    .mac-dots {
      width: 48px;
      display: flex;
      gap: 6px;
    }

    .mac-dots span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .mac-dots span:nth-child(1) { background: #EC695E; }
    .mac-dots span:nth-child(2) { background: #F5BE4F; }
    .mac-dots span:nth-child(3) { background: #61C454; }

    .avatar {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: var(--fs-radius-md);
      background: #FFFFFF;
      color: var(--fs-primary);
      font-size: 16px;
      font-weight: 700;
      box-shadow: var(--fs-shadow-sm);
    }

    .rail-group {
      width: 56px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .rail-spacer { flex: 1; }

    .rail-item {
      width: 56px;
      height: 48px;
      border: 0;
      border-radius: var(--fs-radius-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      background: transparent;
      color: #3E506A;
      font-size: 10px;
    }

    .rail-item:hover { background: rgba(255,255,255,0.64); }
    .rail-item.active { background: #FFFFFF; color: var(--fs-primary); box-shadow: var(--fs-shadow-sm); }

    .sidebar {
      width: 272px;
      flex: 0 0 272px;
      display: flex;
      flex-direction: column;
      padding: 22px 12px 16px;
      border-right: 1px solid var(--fs-divider);
      background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFD 100%);
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 22px;
      line-height: 30px;
      font-weight: 650;
    }

    .brand-mark {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: var(--fs-radius-md);
      background: var(--fs-primary);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
    }

    .global-search {
      position: relative;
      margin: 0 4px 14px;
    }

    .global-search input {
      width: 100%;
      height: 34px;
      padding: 0 48px 0 34px;
      border: 1px solid transparent;
      border-radius: var(--fs-radius-md);
      background: var(--fs-bg-fill);
      color: var(--fs-text-title);
      font-size: 14px;
    }

    .global-search input:focus {
      border-color: var(--fs-primary);
      background: #FFFFFF;
      box-shadow: 0 0 0 2px rgba(56, 115, 250, 0.12);
    }

    .global-search .search-icon {
      position: absolute;
      top: 8px;
      left: 10px;
      color: var(--fs-text-tertiary);
    }

    .keycap {
      position: absolute;
      top: 7px;
      right: 8px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      padding: 0 6px;
      border: 1px solid var(--fs-divider);
      border-radius: var(--fs-radius-sm);
      color: var(--fs-text-tertiary);
      background: #FFFFFF;
      font-size: 12px;
    }

    .side-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding-right: 2px;
    }

    .nav-group {
      padding: 8px 0 10px;
      border-top: 1px solid var(--fs-divider);
    }

    .nav-group:first-child { border-top: 0; padding-top: 0; }

    .nav-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 26px;
      padding: 0 8px;
      color: var(--fs-text-tertiary);
      font-size: 12px;
      line-height: 20px;
    }

    .side-item {
      width: 100%;
      height: 38px;
      border: 0;
      border-radius: var(--fs-radius-lg);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      background: transparent;
      color: var(--fs-text-title);
      font-size: 14px;
      font-weight: 500;
      text-align: left;
    }

    .side-item:hover { background: var(--fs-bg-hover); }
    .side-item.active { background: var(--fs-bg-selected); color: var(--fs-primary); }

    .quick-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .quick-item {
      height: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      border-radius: var(--fs-radius-md);
      color: var(--fs-text-secondary);
      font-size: 13px;
    }

    .quick-item:hover { background: var(--fs-bg-hover); color: var(--fs-text-title); }

    .workspace {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: #FFFFFF;
    }

    .topbar {
      height: 62px;
      flex: 0 0 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 24px;
      border-bottom: 1px solid var(--fs-divider);
      background: rgba(255,255,255,0.94);
    }

    .page-kicker {
      color: var(--fs-text-secondary);
      font-size: 12px;
      line-height: 18px;
    }

    .page-title {
      margin: 0;
      color: var(--fs-text-title);
      font-size: 18px;
      line-height: 26px;
      font-weight: 650;
    }

    .topbar-actions, .row, .tag-row, .action-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .content {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 22px 24px;
      background: #FFFFFF;
    }

    .content.soft {
      background: linear-gradient(180deg, rgba(246,250,255,0.92) 0, rgba(255,255,255,0) 210px), #FFFFFF;
    }

    .content.flat {
      padding: 0;
      background: #FFFFFF;
    }

    .btn {
      height: 32px;
      border: 1px solid var(--fs-border);
      border-radius: var(--fs-radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 12px;
      background: #FFFFFF;
      color: var(--fs-text-title);
      font-size: 14px;
      white-space: nowrap;
      transition: background 160ms var(--fs-ease-out), border-color 160ms var(--fs-ease-out), transform 120ms var(--fs-ease-out);
    }

    .btn:hover { background: var(--fs-bg-hover); }
    .btn:active { transform: scale(0.98); }

    .btn.primary {
      border-color: var(--fs-primary);
      background: var(--fs-primary);
      color: #FFFFFF;
      font-weight: 500;
    }

    .btn.primary:hover { background: var(--fs-primary-hover); }

    .btn.text {
      border-color: transparent;
      background: transparent;
      color: var(--fs-primary);
    }

    .btn.compact {
      height: 28px;
      padding: 0 10px;
      font-size: 13px;
    }

    .icon-button {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: var(--fs-radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--fs-text-secondary);
      background: transparent;
    }

    .icon-button:hover { background: var(--fs-bg-hover); color: var(--fs-text-title); }

    .icon {
      --icon: none;
      width: 18px;
      height: 18px;
      display: inline-flex;
      flex: 0 0 auto;
      color: currentColor;
      background-color: currentColor;
      -webkit-mask: var(--icon) center / contain no-repeat;
      mask: var(--icon) center / contain no-repeat;
    }

    .icon.home { --icon: url("assets/icons/a-AI__主页.svg"); }
    .icon.doc { --icon: url("assets/icons/b-办公文档__Document.svg"); }
    .icon.kb { --icon: url("assets/icons/a-AI__知识库.svg"); }
    .icon.ai { --icon: url("assets/icons/a-AI__AI对话.svg"); }
    .icon.discover { --icon: url("assets/icons/a-AI__发现.svg"); }
    .icon.drive { --icon: url("assets/icons/y-硬件__云存储.svg"); }
    .icon.tools { --icon: url("assets/icons/a-AI__工具.svg"); }
    .icon.search { --icon: url("assets/icons/j-基础__Search.svg"); }
    .icon.plus { --icon: url("assets/icons/f-符号标识__Plus.svg"); }
    .icon.settings { --icon: url("assets/icons/j-基础__-设置.svg"); }
    .icon.folder { --icon: url("assets/icons/b-办公文档__Folder.svg"); }
    .icon.ppt { --icon: url("assets/icons/b-办公文档__PPT.svg"); }
    .icon.meeting { --icon: url("assets/icons/a-AI__会议纪要.svg"); }
    .icon.summary { --icon: url("assets/icons/a-AI__摘要1.svg"); }
    .icon.word { --icon: url("assets/icons/b-办公文档__Word.svg"); }
    .icon.excel { --icon: url("assets/icons/b-办公文档__Excel.svg"); }
    .icon.upload { --icon: url("assets/icons/j-箭头方向__Upload.svg"); }
    .icon.send { --icon: url("assets/icons/j-箭头方向__Send.svg"); }
    .icon.star { --icon: url("assets/icons/f-符号标识__收藏.svg"); }
    .icon.star-on { --icon: url("assets/icons/f-符号标识__已收藏.svg"); }
    .icon.more { --icon: url("assets/icons/j-基础__更多.svg"); }
    .icon.auth { --icon: url("assets/icons/b-办公文档__权限.svg"); }
    .icon.shield { --icon: url("assets/icons/a-安全防护__Shield.svg"); }
    .icon.share { --icon: url("assets/icons/b-编辑__分享.svg"); }
    .icon.comment { --icon: url("assets/icons/j-交流沟通__评论.svg"); }
    .icon.magic { --icon: url("assets/icons/a-AI__魔杖1.svg"); }
    .icon.database { --icon: url("assets/icons/s-数据图表__Database.svg"); }
    .icon.list { --icon: url("assets/icons/b-编辑__列表模式.svg"); }
    .icon.card { --icon: url("assets/icons/b-编辑__卡片查看模式.svg"); }
    .icon.chevron { --icon: url("assets/icons/j-箭头方向__下.svg"); }
    .icon.arrow { --icon: url("assets/icons/j-箭头方向__右.svg"); }
    .icon.lock { --icon: url("assets/icons/b-编辑__Lock.svg"); }

    .card {
      border: 1px solid var(--fs-divider);
      border-radius: var(--fs-radius-lg);
      background: #FFFFFF;
      box-shadow: var(--fs-shadow-sm);
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 16px;
      line-height: 24px;
      font-weight: 650;
    }

    .section-title p {
      margin: 2px 0 0;
      color: var(--fs-text-secondary);
      font-size: 13px;
      line-height: 20px;
    }

    .tag {
      height: 22px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 0 8px;
      border-radius: var(--fs-radius-sm);
      background: var(--fs-bg-hover);
      color: var(--fs-text-secondary);
      font-size: 12px;
      line-height: 20px;
      white-space: nowrap;
    }

    .tag.blue { background: rgba(56,115,250,0.12); color: var(--fs-primary); }
    .tag.green { background: rgba(18,205,122,0.12); color: #0BAA63; }
    .tag.orange { background: rgba(255,171,46,0.14); color: #B66B00; }
    .tag.danger {
      border: 1px solid rgba(255, 77, 72, 0.35);
      background: #FFF0F0;
      color: #D93025;
    }

    .muted { color: var(--fs-text-secondary); }
    .faint { color: var(--fs-text-tertiary); }

    .metric-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }

    .metric-pill {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--fs-divider);
      border-radius: var(--fs-radius-lg);
      background: #FFFFFF;
    }

    .metric-pill strong { font-size: 16px; line-height: 22px; }
    .metric-pill span { color: var(--fs-text-secondary); font-size: 12px; }

    .home-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.16fr) minmax(320px, 0.84fr);
      gap: 16px;
      margin-bottom: 16px;
    }

    .focus-card {
      padding: 18px;
      min-height: 266px;
    }

    .focus-card h2 {
      margin: 0 0 4px;
      font-size: 22px;
      line-height: 32px;
      font-weight: 700;
    }

    .focus-card p {
      margin: 0;
      color: var(--fs-text-secondary);
      font-size: 14px;
      line-height: 22px;
    }

    .quick-start {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    .start-tile {
      min-height: 122px;
      border: 1px solid var(--fs-divider);
      border-radius: var(--fs-radius-lg);
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      background: #FFFFFF;
      text-align: left;
    }

    .start-tile.primary {
      border-color: rgba(56, 115, 250, 0.18);
      background: linear-gradient(180deg, #F7FAFF, #FFFFFF);
    }

    .tile-icon {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: var(--fs-radius-lg);
      background: rgba(56,115,250,0.12);
      color: var(--fs-primary);
    }

    .start-tile strong {
      display: block;
      font-size: 15px;
      line-height: 22px;
    }

    .start-tile span {
      color: var(--fs-text-secondary);
      font-size: 13px;
      line-height: 20px;
    }

    .onboarding {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .step-row {
      display: grid;
      grid-template-columns: 30px minmax(0,1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: var(--fs-radius-lg);
      background: #FAFCFF;
    }

    .step-index {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: var(--fs-radius-full);
      background: rgba(56,115,250,0.12);
      color: var(--fs-primary);
      font-size: 13px;
      font-weight: 650;
    }

    .step-row strong {
      display: block;
      font-size: 14px;
      line-height: 22px;
    }

    .step-row span {
      display: block;
      color: var(--fs-text-secondary);
      font-size: 12px;
      line-height: 18px;
    }

    .two-col {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 0.86fr);
      gap: 16px;
    }

    .panel { padding: 16px; }

    .doc-list, .conv-list, .source-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .doc-row {
      width: 100%;
      border: 0;
      display: grid;
      grid-template-columns: 32px minmax(0,1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: var(--fs-radius-lg);
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: background 160ms var(--fs-ease-out), transform 160ms var(--fs-ease-out), border-color 160ms var(--fs-ease-out), box-shadow 160ms var(--fs-ease-out);
    }

    .doc-row:hover { background: var(--fs-bg-hover); }
    .doc-row:active { transform: scale(0.995); }

    .doc-row h3 {
      margin: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 14px;
      line-height: 22px;
      font-weight: 600;
    }

    .doc-row p {
      margin: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: var(--fs-text-secondary);
      font-size: 12px;
      line-height: 18px;
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    .grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .prompt-card, .kb-card, .resource-card, .tool-card {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 150px;
    }

    .prompt-card {
      min-height: 112px;
      text-align: left;
      border-color: #E8EDF5;
      transition: border-color 160ms var(--fs-ease-out), box-shadow 160ms var(--fs-ease-out), transform 160ms var(--fs-ease-out), background 160ms var(--fs-ease-out);
    }

    .prompt-card:hover {
      border-color: rgba(56,115,250,0.24);
      background: #FAFCFF;
      box-shadow: 0 3px 10px rgba(51, 85, 136, 0.06);
      transform: translateY(-1px);
    }

    .prompt-card:active { transform: scale(0.995); }

    .prompt-card h3, .kb-card h3, .resource-card h3, .tool-card h3 {
      margin: 0;
      font-size: 15px;
      line-height: 22px;
      font-weight: 650;
    }

    .prompt-card p, .kb-card p, .resource-card p, .tool-card p {
      margin: 0;
      color: var(--fs-text-secondary);
      font-size: 13px;
      line-height: 20px;
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .card-title {
      min-width: 0;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .card-avatar {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      display: grid;
      place-items: center;
      border-radius: var(--fs-radius-lg);
      background: rgba(56,115,250,0.12);
      color: var(--fs-primary);
    }

    .card-title h3 {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .tabs {
      display: flex;
      gap: 24px;
      border-bottom: 1px solid var(--fs-divider);
      margin-bottom: 16px;
    }

    .tab {
      height: 38px;
      border: 0;
      background: transparent;
      color: var(--fs-text-secondary);
      font-size: 14px;
      position: relative;
    }

    .tab.active {
      color: var(--fs-primary);
      font-weight: 600;
    }

    .tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      border-radius: 1px;
      background: var(--fs-primary);
    }

    .ai-page {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 16px;
    }

              <div>
                <p style="margin-bottom: 6px;">热门文档</p>
                <div class="tag-row">${item.popular.map((p) => `<span class="tag">${p}</span>`).join("")}</div>
              </div>
              <div class="action-row">
                <button class="btn compact primary" type="button">${icon("plus")}加入</button>
                <button class="btn compact" type="button" data-screen="ai">${icon("ai")}先问问</button>
              </div>
            </article>
          `).join("")}
        </div>
      `;
    }

    function renderDrive() {
      const items = filterItems(files);
      return `
        <div data-screen-label="v2-云盘文件-文档到知识沉淀">
          <div class="section-title">
            <div><h2>云盘文件</h2><p>文件列表直接提供问 AI、摘要、入库动作，避免存储和知识沉淀断裂。</p></div>
            <div class="tag-row"><span class="tag blue">${icon("ai")}可索引 42 个文件</span><span class="tag danger">${icon("lock")}保密文件需授权</span></div>
          </div>
          <section class="card panel">
            <table class="table">
              <colgroup>
                <col style="width: 38%">
                <col style="width: 22%">
                <col style="width: 10%">
                <col style="width: 30%">
              </colgroup>
              <thead><tr><th>名称</th><th>修改时间（修改人）</th><th>大小</th><th style="text-align:right;">知识动作</th></tr></thead>
              <tbody>
                ${items.length ? items.map((file) => `
                  <tr>
                    <td><div class="file-name">${icon(file.type)}<strong>${file.name}</strong><span class="tag ${file.action === "已入库" ? "green" : file.action === "待摘要" ? "orange" : "blue"}">${file.action}</span></div></td>
                    <td><span class="muted">${file.updated}（${file.owner}）</span></td>
                    <td><span class="muted">${file.size}</span></td>
                    <td><div class="action-row" style="justify-content:flex-end;"><button class="btn compact primary" type="button" data-screen="ai">${icon("ai")}问 AI</button><button class="btn compact" type="button" data-toast="已生成摘要">${icon("summary")}摘要</button><button class="btn compact" type="button" data-open-modal>${icon("kb")}入库</button></div></td>
                  </tr>
                `).join("") : `<tr><td colspan="4">${emptyState("没有找到匹配文件", "可以上传资料后让 AI 摘要并加入知识库。", "上传资料")}</td></tr>`}
              </tbody>
            </table>
          </section>
        </div>
      `;
    }

    function renderTools() {
      return `
        <div data-screen-label="v2-知识工具-统一图标">
          <div class="tabs">
            <button class="tab active" type="button">推荐工具</button>
            <button class="tab" type="button">文件流转</button>
            <button class="tab" type="button">知识治理</button>
            <button class="tab" type="button">审计安全</button>
          </div>
          <div class="grid cols-4">
            ${tools.map(([name, desc, iconName]) => `
              <article class="card tool-card">
                <span class="card-avatar">${icon(iconName)}</span>
                <h3>${name}</h3>
                <p>${desc}</p>
                <div class="tag-row"><span class="tag blue">可引用知识库</span><span class="tag">统一线框图标</span></div>
                <button class="btn compact" type="button" data-toast="${name} 已打开">${icon("arrow")}使用</button>
              </article>
            `).join("")}
          </div>
        </div>
      `;
    }

    function renderContent() {
      const content = document.getElementById("content");
      const map = {
        home: renderHome,
        recent: () => renderDocs("最近文档"),
        docs: () => renderDocs("我的文档"),
        editor: renderEditor,
        ai: renderAi,
        knowledge: renderKnowledge,
        discover: renderDiscover,
        drive: renderDrive,
        tools: renderTools
      };
      content.className = state.screen === "editor" ? "content flat" : "content soft";
      content.innerHTML = (map[state.screen] || renderHome)();
      renderTopbar();
      renderSideNav();
    }

    document.addEventListener("click", (event) => {
      const screenTarget = event.target.closest("[data-screen]");
      if (screenTarget) {
        state.screen = screenTarget.dataset.screen;
        renderContent();
        return;
      }

      const scopeTarget = event.target.closest("[data-scope]");
      if (scopeTarget) {
        state.selectedScope = scopeTarget.dataset.scope;
        renderContent();
        return;
      }

      if (event.target.closest("[data-open-modal]")) {
        document.getElementById("linkModal").classList.add("show");
        return;
      }

      if (event.target.closest("[data-close-modal]")) {
        document.getElementById("linkModal").classList.remove("show");
      }

      const kbAsk = event.target.closest("[data-kb-ask]");
      if (kbAsk) {
        showToast("已在右侧展开本库问答");
        return;
      }

      const toastTarget = event.target.closest("[data-toast]");
      if (toastTarget) showToast(toastTarget.dataset.toast);
    });

    document.getElementById("globalSearch").addEventListener("input", (event) => {
      state.query = event.target.value;
      renderContent();
    });

    renderRail();
    renderContent();
  </script>
</body>
</html>
